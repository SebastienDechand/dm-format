@if (homeData?.banner) {
  <app-banner
    [bannerData]="homeData.banner"
    [pageId]="'home-banner'"
    (imageUploaded)="onBannerImageUploaded($event)"
  ></app-banner>
}
@if (homeData?.certification) {
  <app-certification
    [certificationData]="homeData.certification"
  ></app-certification>
}
<app-programs></app-programs>
@if (homeData?.partner) {
  <app-partner [partnerData]="homeData.partner"></app-partner>
}
<app-gallery></app-gallery>

@if (isAdmin()) {
  <button class="save-btn" (click)="saveChanges()">
    <span class="save-text">Sauvegarder les modifications</span>
    <svg lucideIcon="save" class="save-icon"></svg>
  </button>
}
