<section class="gallery">
  <h2>Galerie de Nos <span>Formations</span></h2>
  <p class="gallery-description">
    Découvrez quelques moments de nos formations en action.
  </p>

  <!-- Bouton de rechargement et indicateur de chargement -->
  <div class="gallery-controls">
    <button (click)="refreshGallery()" class="refresh-btn">
      <i class="fa-solid fa-arrows-rotate"></i> Actualiser
    </button>
    <div *ngIf="isLoading" class="loading-indicator">
      Chargement en cours...
    </div>
  </div>

  <!-- Message si aucune image -->
  <div *ngIf="!isLoading && images.length === 0" class="no-images">
    Aucune image disponible dans la galerie.
  </div>

  <!-- Grille de la galerie -->
  <div class="gallery-grid" *ngIf="images.length > 0">
    <div
      class="gallery-item"
      *ngFor="let image of images"
      (click)="openLightbox(image)"
    >
      <img [src]="image.src" [alt]="image.title" />
      <div class="gallery-caption">
        <h3>{{ image.title }}</h3>
        <p>{{ image.description }}</p>
      </div>
      <button
        *ngIf="isAdmin$ | async"
        class="delete-btn"
        (click)="openDeleteModal(image._id || ''); $event.stopPropagation()"
      >
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" *ngIf="selectedImage">
    <div class="lightbox-content">
      <button class="close-lightbox-btn" (click)="closeLightbox()">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img [src]="selectedImage.src" [alt]="selectedImage.title" />
      <div class="lightbox-caption">
        <h3>{{ selectedImage.title }}</h3>
        <p>{{ selectedImage.description }}</p>
      </div>
    </div>
  </div>

  <!-- Bouton d'upload (admin seulement) -->
  <label class="file-upload" *ngIf="isAdmin$ | async">
    <input type="file" (change)="uploadImage($event)" accept="image/*" />
    <span class="file-upload-label">
      <i class="fa-solid fa-upload"></i> Ajouter une image
    </span>
  </label>

  <!-- Modal de confirmation de suppression -->
  <app-confirm-dialog
    *ngIf="showDeleteModal"
    title="Confirmer la suppression"
    message="Êtes-vous sûr(e) de vouloir supprimer cette image ?"
    (confirmed)="confirmDelete()"
    (canceled)="closeDeleteModal()"
  >
  </app-confirm-dialog>
</section>
