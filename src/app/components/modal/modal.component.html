    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeModal()" aria-label="Fermer">
        <svg lucideIcon="x"></svg>

      <h2>{{ title() }}</h2>

    </div>
  </div>
}
