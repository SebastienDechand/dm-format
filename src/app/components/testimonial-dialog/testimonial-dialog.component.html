<div class="dialog-header">
  <div>
    <h2 mat-dialog-title>{{ data.name }}</h2>
    <h3 mat-dialog-subtitle>{{ data.role }}</h3>
  </div>
  <button
    mat-icon-button
    mat-dialog-close
    class="close-button"
    aria-label="Fermer"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <p>{{ data.feedback }}</p>
</mat-dialog-content>
