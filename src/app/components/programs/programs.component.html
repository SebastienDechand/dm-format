<section class="programs-overview">
  <h2>Notre catalogue de formations</h2>

  <div class="programs-grid">
    <mat-card
      *ngFor="let training of trainings; trackBy: trackByIndex"
      class="program-card"
    >
      <img
        mat-card-image
        [src]="training.banner.src"
        [alt]="stripHtmlTags(training.title)"
      />
      <span class="program-badge" *ngIf="training.duration">{{ training.duration }}</span>
      <mat-card-title>{{ stripHtmlTags(training.title) }}</mat-card-title>
      <mat-card-actions>
        <a [routerLink]="['/trainings', training._id]">
          <button mat-button>En savoir plus</button>
        </a>
      </mat-card-actions>
    </mat-card>
  </div>
</section>
