@if (isLoggedIn$ | async) {
  <div class="admin-toggle-container">
    <button
      mat-raised-button
      color="primary"
      (click)="toggleAdminMode()"
      class="btn-desktop"
    >
      @if (isAdmin$ | async) {
        <lucide-icon name="user"></lucide-icon>
      }
      @if (!(isAdmin$ | async)) {
        <lucide-icon name="shield-user"></lucide-icon>
      }
      <span class="btn-label">
        {{ (isAdmin$ | async) ? 'Mode utilisateur' : 'Mode administrateur' }}
      </span>
    </button>
    <button (click)="toggleAdminMode()" class="btn-mobile">
      @if (isAdmin$ | async) {
        <lucide-icon name="user"></lucide-icon>
      }
      @if (!(isAdmin$ | async)) {
        <lucide-icon name="shield-user"></lucide-icon>
      }
    </button>
  </div>
}
