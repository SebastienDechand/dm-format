<section class="hero">
  <div class="hero-content">
    <h1 [innerHTML]="bannerData?.title | safeHtml"></h1>
    <h2 class="subtitle">{{ bannerData?.subtitle }}</h2>
    <p class="details">{{ bannerData?.details }}</p>
    <ul class="highlights">
      <li *ngFor="let highlight of bannerData?.highlights">{{ highlight }}</li>
    </ul>
  </div>
  <div class="hero-image">
    <img [src]="bannerData?.image" alt="Exercice de massage cardiaque" />
  </div>
</section>
