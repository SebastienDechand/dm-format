<section class="hero">
  <div class="hero-content">
    <p class="hero-eyebrow">
      <svg
        class="hero-eyebrow-mark"
        viewBox="0 0 32 16"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M0 8H8L11 2L14 14L17 8H32"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Sauveteur secouriste du travail
    </p>

    <h1>
      <span [innerHTML]="safeTitle"></span>
    </h1>

    <h2 class="subtitle">{{ bannerData?.subtitle }}</h2>

    <p class="details">{{ bannerData?.details }}</p>

    <ul class="highlights">
      @for (
        highlight of bannerData?.highlights;
        track trackByIndex(i, highlight);
        let i = $index
      ) {
        <li>
          <span class="highlight-mark"
            ><svg lucideIcon="check"></svg
          ></span>
          <span>{{ highlight }}</span>
        </li>
      }
    </ul>
  </div>

  <div class="hero-visual">
    <div class="hero-image-frame">
      <img
        [src]="bannerData?.image"
        alt="Exercice de massage cardiaque"
        class="hero-banner-image"
        loading="lazy"
      />

      @if (bannerData?.highlights?.[0]) {
        <div class="hero-floating-card">
          <svg
            class="hero-pulse"
            viewBox="0 0 160 32"
            fill="none"
            aria-hidden="true"
          >
            <path
              class="hero-pulse-path"
              d="M0 16H58L64 16L70 4L78 28L84 16H160"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p>{{ bannerData.highlights[0] }}</p>
        </div>
      }
    </div>
  </div>
</section>
