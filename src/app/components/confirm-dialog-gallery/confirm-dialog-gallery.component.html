<div class="modal-overlay">
  <div class="modal">
    <h3>{{ title() }}</h3>
    <p>{{ message() }}</p>
    <div class="modal-actions">
      <button class="cancel-btn" (click)="cancel()">Annuler</button>
      <button class="confirm-btn" (click)="confirm()">Confirmer</button>
    </div>
  </div>
</div>
