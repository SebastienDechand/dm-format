<div class="certification">
  <h2>{{ certificationData?.title }}</h2>
  <p>{{ certificationData?.description }}</p>
  <p>{{ certificationData?.additionalInfo }}</p>
  <a [href]="certificationData?.certificateLink" target="_blank"
    >Voir le certificat</a
  >
  <img [src]="certificationData?.certificateImage" alt="Certification Image" />
</div>
