<section class="certification">
  <div class="certification-container">
    <div class="certification-content">
      <h2>
        <span [innerHTML]="certificationData?.title | safeHtml"></span>
      </h2>

      <p>{{ certificationData?.description }}</p>

      <p>{{ certificationData?.additionalInfo }}</p>
    </div>

    <!-- 📎 Panneau des documents de certification -->
    <div class="certification-documents">
      <p class="eyebrow">Documents officiels</p>

      @if (hasPdfs) {
        <ul class="pdf-list">
          @for (pdf of filteredPdfs; track pdf) {
            <li class="pdf-item">
              <a
                [href]="'https://docs.google.com/viewer?url=' + pdf.pdfUrl"
                target="_blank"
                class="pdf-link"
                rel="noopener noreferrer"
                type="application/pdf"
              >
                <img
                  src="assets/images/pdf-placeholder.png"
                  alt="PDF"
                  class="pdf-icon"
                  loading="lazy"
                />
                <span class="pdf-title">{{ pdf.title | slice: 0 : -4 }}</span>
              </a>
            </li>
          }
        </ul>
      }

      @if (!hasPdfs) {
        <p class="documents-empty">
          Les documents de certification seront bientôt disponibles ici.
        </p>
      }
    </div>
  </div>
</section>
