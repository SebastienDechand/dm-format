<section class="certification">
  <div class="certification-container">
    <div class="certification-content">
      <h2 [innerHTML]="certificationData?.title | safeHtml"></h2>
      <p>{{ certificationData?.description }}</p>
      <p>{{ certificationData?.additionalInfo }}</p>
      <a
        [href]="certificationData?.certificateLink"
        target="_blank"
        class="certification-button"
        >Voir le certificat</a
      >
    </div>
    <div class="certification-logo">
      <img [src]="certificationData?.certificateImage" alt="Qualiopi" />
    </div>
  </div>
</section>
