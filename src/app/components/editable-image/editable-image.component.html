<!-- src/app/components/editable-image/editable-image.component.html -->
<div
  class="image-container"
  [class.editable]="isEditable"
  (click)="openFileSelector()"
>
  <img *ngIf="imageSrc" [src]="imageSrc" [alt]="altText" [class]="imageClass" />

  <div *ngIf="isEditable" class="image-overlay" [class.uploading]="isUploading">
    <div *ngIf="isUploading" class="upload-spinner">
      <lucide-icon name="loader-circle" class="spin-icon"></lucide-icon>
    </div>
    <div *ngIf="!isUploading" class="upload-prompt">
      <lucide-icon name="camera"></lucide-icon>
      <span>Cliquer pour modifier</span>
    </div>
  </div>
</div>
